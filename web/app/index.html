<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Easy Engine · 积木</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #E9EEF2; }
  #blocklyDiv { position: absolute; inset: 0; }
  /* 状态提示：不支持某些积木、或者还没选中节点时，用一行小字说清楚 */
  #toast {
    position: absolute; left: 12px; bottom: 12px; max-width: 70%;
    padding: 8px 12px; border-radius: 6px;
    background: rgba(40, 46, 60, 0.92); color: #fff;
    font: 13px/1.5 "Helvetica Neue", Helvetica, Arial, "Microsoft YaHei", sans-serif;
    display: none; z-index: 10; pointer-events: none;
  }
  #toast.warn { background: rgba(180, 90, 40, 0.95); }
</style>
</head>
<body>
<div id="blocklyDiv"></div>
<div id="toast"></div>

<script src="vendor/scratch-blocks/scratch-blocks.js"></script>
<script src="vendor/scratch-blocks/scratch_msgs.js"></script>
<script src="vendor/scratch-blocks/default_toolbox.js"></script>
<script src="dialogs.js"></script>
<script src="bridge.js"></script>
<script>
  // 中文：必须在 inject 之前调用，积木是在 inject 时创建并把文案定下来的
  if (window.Blockly && Blockly.ScratchMsgs) {
    Blockly.ScratchMsgs.setLocale('zh-cn');
  }

  var workspace = Blockly.inject('blocklyDiv', {
    media: 'vendor/scratch-blocks/media/',
    toolbox: (Blockly.Blocks && Blockly.Blocks.defaultToolbox) ? Blockly.Blocks.defaultToolbox : null,
    zoom: { controls: true, wheel: true, startScale: 0.75, maxScale: 2, minScale: 0.4, scaleSpeed: 1.1 },
    colours: {
      workspace: '#F9F9F9',
      toolbox: '#FFFFFF',
      toolboxes: '#FFFFFF',
      flyout: '#F9F9F9',
      scrollbar: '#CECDCE',
      scrollbarHover: '#CECDCE',
      text: '#575E75',
      textField: '#FFFFFF',
      insertionMarker: '#000000',
      insertionMarkerOpacity: 0.15,
      workspaceBlocks: '#FFFFFF'
    },
    grid: { spacing: 40, length: 3, colour: '#E6EBF0', snap: true },
    scrollbars: true,
    sounds: false
  });

  // ---- 提示条 ----
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function toast(text, warn) {
    if (!text) { toastEl.style.display = 'none'; return; }
    toastEl.textContent = text;
    toastEl.className = warn ? 'warn' : '';
    toastEl.style.display = 'block';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.style.display = 'none'; }, 4000);
  }
  window.eeToast = toast;

  // ---- 接上引擎 ----
  var inEngine = !!(window.chrome && window.chrome.webview);
  eeAttach(workspace);

  if (!inEngine) {
    // 直接在浏览器里打开时，放个示例，方便调外观
    var demo = `
<xml xmlns="http://www.w3.org/1999/xhtml">
  <block type="event_whenflagclicked" x="40" y="40">
    <next>
      <block type="control_repeat">
        <value name="TIMES"><shadow type="math_whole_number"><field name="NUM">10</field></shadow></value>
        <statement name="SUBSTACK">
          <block type="motion_movesteps">
            <value name="STEPS"><shadow type="math_number"><field name="NUM">10</field></shadow></value>
            <next>
              <block type="motion_turnright">
                <value name="DEGREE"><shadow type="math_number"><field name="NUM">15</field></shadow></value>
              </block>
            </next>
          </block>
        </statement>
      </block>
    </next>
  </block>
</xml>`;
    Blockly.Xml.domToWorkspace(Blockly.Xml.textToDom(demo), workspace);
    workspace.cleanUp();
  }

  window.requestAnimationFrame(function () {
    window.requestAnimationFrame(function () {
      window.__eeReady = true;
      document.title = 'READY';
    });
  });
</script>
</body>
</html>
